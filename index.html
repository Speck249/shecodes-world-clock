<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="icon" type="image/png" href="./images/favicon.png">
    <link rel="stylesheet" href="./src/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.45/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
</head>

<body>
  <div id="world-clock" class="world-clock-container">
    <header>
      <a href="/" aria-label="Reload App">
        <h1>World Clock</h1>
      </a>
      <img src="./images/logo text.gif" width="720" height="300" alt="SheCodes Logo" aria-label="Reload" class="logo" />
    </header>
      
    <main>
      <div id="city-select" class="select-city">
        <select name="city-time-date" id="time-zone">
          <optgroup>
            <option value="">Select City</option>
          </optgroup>
        </select>
      </div>

      <div id="current-location" class="current-location">
        <span>
          <small>📌 Your Estimated Current Location</small>
          <p class="current-city"></p>
        </span>

        <p class="current-date"></p>
        <p class="current-time"></p>
      </div>

      <div id="display" class="display-city"></div>
    </main>
    
    <footer>
        This project was coded by <a href="#">Rediet Kifle</a>, 
        open-sourced on <a href="https://github.com/Speck249/shecodes-world-clock" target="_blank">GitHub</a> 
        and hosted on <a href="https://project-shecodes-world-clock.netlify.app" target="_blank">Netlify</a>.
    </footer>
  </div>  
  <script src="./src/index.js"></script>
</body>
</html>
